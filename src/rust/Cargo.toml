[package]
name = "fontfreeze"
version = "2.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

# Native CLI for comparing the output with other implementations; not part of the web build.
[[bin]]
name = "fontfreeze-cli"
path = "cli.rs"
required-features = ["cli"]

[features]
cli = ["dep:serde_json"]

[dependencies]
# All fontoxide crates must use the same rev, or their types (e.g. Font) won't match.
fontoxide-ttlib = { git = "https://github.com/MuTsunTsai/fontoxide", rev = "4f987ac8f610b57292763d2d7f97ee41eab9315a" }
fontoxide-subset = { git = "https://github.com/MuTsunTsai/fontoxide", rev = "4f987ac8f610b57292763d2d7f97ee41eab9315a" }
fontoxide-varlib = { git = "https://github.com/MuTsunTsai/fontoxide", rev = "4f987ac8f610b57292763d2d7f97ee41eab9315a" }
fontoxide-encodings = { git = "https://github.com/MuTsunTsai/fontoxide", rev = "4f987ac8f610b57292763d2d7f97ee41eab9315a" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1", optional = true }

[dev-dependencies]
# An independent shaper and parser (fontations), for checking the output of fontoxide.
harfrust = "0.15"
read-fonts = "0.46"
# Keeps the order of the variations in the arguments written as JSON, as the UI sends them.
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
