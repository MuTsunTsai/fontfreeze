name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-progress deployment, but skip queued ones in favor of the latest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Needed by the postinstall script (uv sync) and the gulp task (pyminify).
      # uv also fetches the Python version required by pyproject.toml.
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      # Runs gulp first (prebuild), then rsbuild.
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
